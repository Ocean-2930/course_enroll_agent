<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent · 수강권 관리</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-header__badge" aria-hidden="true">🎟️</span>
    <h1 class="app-header__title">수강권 관리</h1>
    <a class="app-header__back" href="../index.html">← 홈</a>
  </header>

  <main class="agent-wrap">
    <section class="card" aria-label="수강권 관리 Agent">
      <header class="card__header">
        <button type="button" class="card__back" id="backBtn" aria-label="역할 다시 선택" hidden>&larr;</button>
        <h2 class="card__title">
          <span class="card__badge" id="headerBadge" aria-hidden="true">🎟️</span>
          <span id="headerTitle">수강권 관리 Agent</span>
        </h2>
      </header>

      <!-- 1단계: 역할 선택 -->
      <div class="view role-view" id="roleView">
        <p class="role-view__lead">어떤 방식으로 이용하시나요? 역할에 맞는 관리 화면으로 안내해 드릴게요.</p>

        <div class="role-grid">
          <button type="button" class="role-card" data-role="owner">
            <span class="role-card__icon" aria-hidden="true">🏫</span>
            <span class="role-card__text">
              <span class="role-card__name">자영업자 (사업자)</span>
              <span class="role-card__desc">수강권 상품 등록, 회원 수강권 발급·차감, 매출·잔여 현황을 관리해요.</span>
            </span>
          </button>

          <button type="button" class="role-card" data-role="member">
            <span class="role-card__icon" aria-hidden="true">🙋</span>
            <span class="role-card__text">
              <span class="role-card__name">회원 (이용자)</span>
              <span class="role-card__desc">내 수강권 잔여 횟수·만료일 확인, 사용 내역 조회, 예약·환불을 요청해요.</span>
            </span>
          </button>
        </div>
      </div>

      <!-- 2단계: 계정 선택 -->
      <div class="view account-view" id="accountView" hidden>
        <p class="account-view__lead" id="accountLead"></p>

        <div class="field">
          <label class="field__label" for="academySelect">
            아카데미 <span class="field__req" aria-hidden="true">*</span>
          </label>
          <select class="input" id="academySelect">
            <option value="">아카데미를 불러오는 중…</option>
          </select>
          <p class="field__hint" id="academyHint">진입할 아카데미를 선택하세요.</p>
        </div>

        <div class="field" id="studentField" hidden>
          <label class="field__label" for="studentSelect">
            수강생 계정 <span class="field__req" aria-hidden="true">*</span>
          </label>
          <select class="input" id="studentSelect" disabled>
            <option value="">아카데미를 먼저 선택하세요</option>
          </select>
          <p class="field__hint" id="studentHint">선택한 아카데미의 수강생 계정으로 진입합니다.</p>
        </div>

        <div class="form-status" id="accountStatus" role="status" aria-live="polite" hidden></div>

        <div class="form-actions">
          <button type="button" class="btn btn--primary" id="enterBtn" disabled>시작하기</button>
        </div>
      </div>

      <!-- 3단계: 역할별 화면 (사업자는 수강권 관리 + 채팅) -->
      <div class="view" id="chatView" hidden>
        <!-- 사업자 전용: 수강권 정보 관리 (항상 채팅 위) -->
        <section class="pass-panel" id="passPanel" hidden aria-label="수강권 정보 관리">
          <div class="pass-panel__head">
            <h3 class="pass-panel__title">수강권 정보 관리</h3>
            <button type="button" class="pass-add-btn" id="addPassBtn" aria-label="수강권 종류 추가">+</button>
          </div>
          <div class="pass-scroll" id="passScroll"></div>
        </section>

        <div class="card__body" id="messages" aria-live="polite"></div>

        <footer class="card__footer">
          <form class="chat-form" id="chatForm">
            <label for="chatInput" class="sr-only">메시지 입력</label>
            <textarea
              id="chatInput"
              class="chat-form__input"
              rows="1"
              placeholder="메시지를 입력하세요…"
              autocomplete="off"
            ></textarea>
            <button type="submit" class="chat-form__send" id="sendBtn" aria-label="보내기" disabled>➤</button>
          </form>
        </footer>
      </div>
    </section>
  </main>

  <script src="../assets/api.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const backBtn = document.getElementById("backBtn");
    const roleView = document.getElementById("roleView");
    const accountView = document.getElementById("accountView");
    const chatView = document.getElementById("chatView");
    const headerBadge = document.getElementById("headerBadge");
    const headerTitle = document.getElementById("headerTitle");
    const roleButtons = document.querySelectorAll(".role-card");

    const accountLead = document.getElementById("accountLead");
    const academySelect = document.getElementById("academySelect");
    const academyHint = document.getElementById("academyHint");
    const studentField = document.getElementById("studentField");
    const studentSelect = document.getElementById("studentSelect");
    const studentHint = document.getElementById("studentHint");
    const accountStatus = document.getElementById("accountStatus");
    const enterBtn = document.getElementById("enterBtn");

    const passPanel = document.getElementById("passPanel");
    const passScroll = document.getElementById("passScroll");
    const addPassBtn = document.getElementById("addPassBtn");

    // 역할별 화면 구성 (자영업자 / 회원)
    const ROLES = {
      owner: {
        badge: "🏫",
        title: "수강권 관리 · 사업자",
        needsStudent: false,
        accountLead: "관리할 아카데미를 선택하세요.",
        placeholder: "예: 10회권 상품을 새로 만들어줘",
        greeting: (ctx) =>
          `사업자 모드예요. '${ctx.academyName}' 아카데미를 기준으로 수강권 상품 등록, 회원 발급·차감, 매출 현황 중 무엇을 도와드릴까요?`,
      },
      member: {
        badge: "🙋",
        title: "수강권 관리 · 회원",
        needsStudent: true,
        accountLead: "아카데미와 본인 수강생 계정을 선택하세요.",
        placeholder: "예: 내 수강권 몇 회 남았는지 알려줘",
        greeting: (ctx) =>
          `회원 모드예요. '${ctx.academyName}'의 '${ctx.studentName}' 님, 내 수강권 잔여 횟수·만료일·사용 내역 중 무엇이 궁금하세요?`,
      },
    };

    // 현재 진행 상태
    let currentRole = null;
    const selected = { academy: null, student: null };

    // ---------- 공통 유틸 ----------
    function addMessage(text, from) {
      const el = document.createElement("div");
      el.className = "message message--" + from;
      el.textContent = text; // 사용자 입력은 textContent로만 렌더링
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function syncInput() {
      sendBtn.disabled = input.value.trim().length === 0;
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 96) + "px";
    }

    function setAccountStatus(kind, message) {
      if (!kind) {
        accountStatus.hidden = true;
        return;
      }
      accountStatus.className = "form-status form-status--" + kind;
      accountStatus.textContent = message;
      accountStatus.hidden = false;
    }

    // select 를 한 개의 안내 옵션으로 채운다.
    function setSelectPlaceholder(select, text) {
      select.textContent = "";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = text;
      select.appendChild(opt);
    }

    // select 를 { id, name } 목록으로 채운다.
    function fillSelect(select, items, placeholder, emptyText) {
      select.textContent = "";
      const head = document.createElement("option");
      head.value = "";
      head.textContent = items.length ? placeholder : emptyText;
      select.appendChild(head);
      for (const item of items) {
        const opt = document.createElement("option");
        opt.value = String(item.id);
        opt.textContent = item.name;
        select.appendChild(opt);
      }
    }

    function refreshEnterEnabled() {
      const ok = currentRole &&
        selected.academy &&
        (!ROLES[currentRole].needsStudent || selected.student);
      enterBtn.disabled = !ok;
    }

    // ---------- 단계 전환 ----------
    function showRolePicker() {
      chatView.hidden = true;
      accountView.hidden = true;
      roleView.hidden = false;
      backBtn.hidden = true;
      headerBadge.textContent = "🎟️";
      headerTitle.textContent = "수강권 관리 Agent";
      currentRole = null;
    }

    function goToAccountStep(roleKey) {
      const role = ROLES[roleKey];
      if (!role) return;
      currentRole = roleKey;
      selected.academy = null;
      selected.student = null;

      headerBadge.textContent = role.badge;
      headerTitle.textContent = role.title;
      accountLead.textContent = role.accountLead;
      studentField.hidden = !role.needsStudent;
      setSelectPlaceholder(studentSelect, "아카데미를 먼저 선택하세요");
      studentSelect.disabled = true;
      setAccountStatus(null);
      enterBtn.disabled = true;

      roleView.hidden = true;
      chatView.hidden = true;
      accountView.hidden = false;
      backBtn.hidden = false;

      loadAcademies();
    }

    function enterChat() {
      const role = ROLES[currentRole];
      const ctx = {
        academyName: selected.academy ? selected.academy.name : "",
        studentName: selected.student ? selected.student.name : "",
      };
      input.placeholder = role.placeholder;
      messagesEl.innerHTML = "";
      addMessage(role.greeting(ctx), "bot");

      // 사업자만 수강권 정보 관리 섹션을 노출하고 목록을 불러온다.
      if (currentRole === "owner") {
        passPanel.hidden = false;
        loadPassTypes(selected.academy.id);
      } else {
        passPanel.hidden = true;
        passScroll.textContent = "";
      }

      accountView.hidden = true;
      chatView.hidden = false;
      input.value = "";
      syncInput();
      input.focus();
    }

    // ---------- 수강권 정보 관리 (사업자) ----------
    function formatPrice(price) {
      const n = Number(price) || 0;
      return n.toLocaleString("ko-KR") + "원";
    }

    // 수강권 종류 카드 하나를 만든다(모든 값은 textContent로 안전하게).
    function buildPassCard(passType) {
      const card = document.createElement("div");
      card.className = "pass-card";

      const name = document.createElement("div");
      name.className = "pass-card__name";
      name.textContent = passType.name;

      const meta = document.createElement("div");
      meta.className = "pass-card__meta";
      const sessions = document.createElement("span");
      sessions.textContent = "총 " + passType.total_sessions + "회";
      const validity = document.createElement("span");
      validity.textContent = "유효기간 " + passType.validity_days + "일";
      meta.append(sessions, validity);

      const price = document.createElement("div");
      price.className = "pass-card__price";
      price.textContent = formatPrice(passType.price);

      card.append(name, meta, price);

      if (passType.description) {
        const desc = document.createElement("div");
        desc.className = "pass-card__desc";
        desc.textContent = passType.description;
        card.appendChild(desc);
      }

      // 수정 / 삭제
      const tools = document.createElement("div");
      tools.className = "pass-card__tools";
      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "btn btn--ghost";
      editBtn.textContent = "수정";
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "btn btn--danger";
      delBtn.textContent = "삭제";
      tools.append(editBtn, delBtn);
      card.appendChild(tools);

      // 수정: 카드를 수정용 입력 카드로 교체(PATCH)
      editBtn.addEventListener("click", () => {
        const formCard = buildPassForm({
          initial: passType,
          submitLabel: "저장",
          onSubmit: (payload) =>
            CourseApi.passTypes.update(selected.academy.id, passType.id, payload),
          onDone: (updated) =>
            passScroll.replaceChild(buildPassCard(updated), formCard),
          onCancel: () =>
            passScroll.replaceChild(buildPassCard(passType), formCard),
        });
        passScroll.replaceChild(formCard, card);
        formCard.scrollIntoView({ block: "nearest", inline: "nearest" });
        formCard.querySelector('input[data-k="name"]').focus();
      });

      // 삭제: 확인 후 DELETE
      delBtn.addEventListener("click", async () => {
        if (!window.confirm("'" + passType.name + "' 수강권 종류를 삭제할까요?")) {
          return;
        }
        editBtn.disabled = true;
        delBtn.disabled = true;
        delBtn.textContent = "삭제 중…";
        try {
          await CourseApi.passTypes.remove(selected.academy.id, passType.id);
          card.remove();
          if (!passScroll.children.length) {
            renderPassScrollMessage("등록된 수강권 종류가 없어요. 오른쪽 + 로 추가하세요.");
          }
        } catch (err) {
          editBtn.disabled = false;
          delBtn.disabled = false;
          delBtn.textContent = "삭제";
          window.alert(CourseApi.messageFromError(err));
        }
      });

      return card;
    }

    function renderPassScrollMessage(text) {
      passScroll.textContent = "";
      const msg = document.createElement("div");
      msg.className = "pass-scroll__empty";
      msg.textContent = text;
      passScroll.appendChild(msg);
    }

    async function loadPassTypes(academyId) {
      renderPassScrollMessage("수강권 종류를 불러오는 중…");
      try {
        const page = await CourseApi.passTypes.list(academyId, {
          limit: 100,
          sort: "created_at",
          order: "desc",
        });
        const items = page.items || [];
        passScroll.textContent = "";
        if (!items.length) {
          renderPassScrollMessage("등록된 수강권 종류가 없어요. 오른쪽 + 로 추가하세요.");
          return;
        }
        for (const item of items) {
          passScroll.appendChild(buildPassCard(item));
        }
      } catch (err) {
        renderPassScrollMessage(CourseApi.messageFromError(err));
      }
    }

    // 생성/수정 공용 입력 카드를 만든다.
    // opts: { initial, submitLabel, onSubmit(payload)->Promise, onDone(result), onCancel() }
    function buildPassForm(opts) {
      opts = opts || {};
      const initial = opts.initial || null;
      const submitLabel = opts.submitLabel || "저장";

      const card = document.createElement("div");
      card.className = "pass-card pass-card--form";
      card.innerHTML =
        '<input class="input" data-k="name" type="text" maxlength="200" placeholder="이름 (예: 10회권)" />' +
        '<input class="input" data-k="total_sessions" type="number" min="1" placeholder="총 횟수" />' +
        '<input class="input" data-k="validity_days" type="number" min="1" placeholder="유효기간(일)" />' +
        '<input class="input" data-k="price" type="number" min="0" placeholder="가격(원)" />' +
        '<textarea class="input" data-k="description" placeholder="설명 (선택)"></textarea>' +
        '<div class="pass-card__error" data-role="error" hidden></div>' +
        '<div class="pass-card__actions">' +
        '  <button type="button" class="btn btn--primary" data-role="save"></button>' +
        '  <button type="button" class="btn btn--ghost" data-role="cancel">취소</button>' +
        "</div>";

      const errorEl = card.querySelector('[data-role="error"]');
      const saveBtn = card.querySelector('[data-role="save"]');
      const cancelBtn = card.querySelector('[data-role="cancel"]');
      const get = (k) => card.querySelector('[data-k="' + k + '"]');

      saveBtn.textContent = submitLabel;

      // 수정 모드: 기존 값 채우기(값은 폼 필드에만 들어가므로 안전)
      if (initial) {
        get("name").value = initial.name;
        get("total_sessions").value = initial.total_sessions;
        get("validity_days").value = initial.validity_days;
        get("price").value = initial.price;
        get("description").value = initial.description || "";
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }

      cancelBtn.addEventListener("click", () => {
        if (opts.onCancel) opts.onCancel();
      });

      saveBtn.addEventListener("click", async () => {
        const name = get("name").value.trim();
        const total = parseInt(get("total_sessions").value, 10);
        const validity = parseInt(get("validity_days").value, 10);
        const priceRaw = get("price").value.trim();
        const price = priceRaw === "" ? 0 : parseInt(priceRaw, 10);
        const description = get("description").value.trim();

        if (!name) return showError("이름을 입력해 주세요.");
        if (!Number.isInteger(total) || total < 1)
          return showError("총 횟수는 1 이상의 숫자여야 해요.");
        if (!Number.isInteger(validity) || validity < 1)
          return showError("유효기간은 1 이상의 숫자여야 해요.");
        if (!Number.isInteger(price) || price < 0)
          return showError("가격은 0 이상의 숫자여야 해요.");

        errorEl.hidden = true;
        // description 은 비우면 null 로 보내 서버 값도 지운다.
        const payload = {
          name: name,
          total_sessions: total,
          validity_days: validity,
          price: price,
          description: description || null,
        };

        saveBtn.disabled = true;
        cancelBtn.disabled = true;
        saveBtn.textContent = "저장 중…";
        try {
          const result = await opts.onSubmit(payload);
          if (opts.onDone) opts.onDone(result);
        } catch (err) {
          showError(CourseApi.messageFromError(err));
          saveBtn.disabled = false;
          cancelBtn.disabled = false;
          saveBtn.textContent = submitLabel;
        }
      });

      return card;
    }

    // + 버튼: 생성용 입력 카드를 맨 앞에 추가한다.
    function openPassForm() {
      // 이미 열려 있는 입력 카드가 있으면 그쪽으로 포커스
      const existing = passScroll.querySelector(".pass-card--form");
      if (existing) {
        existing.querySelector("input").focus();
        return;
      }
      // 안내 메시지만 있는 경우 비운다.
      const emptyMsg = passScroll.querySelector(".pass-scroll__empty");
      if (emptyMsg) emptyMsg.remove();

      const formCard = buildPassForm({
        submitLabel: "저장",
        onSubmit: (payload) =>
          CourseApi.passTypes.create(selected.academy.id, payload),
        onDone: (created) =>
          passScroll.replaceChild(buildPassCard(created), formCard),
        onCancel: () => {
          formCard.remove();
          if (!passScroll.children.length) {
            renderPassScrollMessage("등록된 수강권 종류가 없어요. 오른쪽 + 로 추가하세요.");
          }
        },
      });

      passScroll.prepend(formCard);
      formCard.scrollIntoView({ block: "nearest", inline: "start" });
      formCard.querySelector('input[data-k="name"]').focus();
    }

    // 뒤로가기: 채팅 → 계정 선택 → 역할 선택
    function goBack() {
      if (!chatView.hidden) {
        chatView.hidden = true;
        accountView.hidden = false;
      } else if (!accountView.hidden) {
        showRolePicker();
      }
    }

    // ---------- 데이터 로딩 ----------
    async function loadAcademies() {
      selected.academy = null;
      refreshEnterEnabled();
      academySelect.disabled = true;
      setSelectPlaceholder(academySelect, "아카데미를 불러오는 중…");
      academyHint.textContent = "진입할 아카데미를 선택하세요.";

      try {
        const page = await CourseApi.academies.list({ limit: 100, sort: "name" });
        const items = page.items || [];
        fillSelect(academySelect, items, "아카데미를 선택하세요", "등록된 아카데미가 없습니다");
        academySelect.disabled = false;
        if (!items.length) {
          academyHint.textContent = "먼저 '정보 등록'에서 아카데미를 만들어 주세요.";
        }
      } catch (err) {
        setSelectPlaceholder(academySelect, "목록을 불러오지 못했습니다");
        setAccountStatus("error", CourseApi.messageFromError(err));
      }
    }

    async function loadStudents(academyId) {
      selected.student = null;
      refreshEnterEnabled();
      studentSelect.disabled = true;
      setSelectPlaceholder(studentSelect, "수강생을 불러오는 중…");
      studentHint.textContent = "선택한 아카데미의 수강생 계정으로 진입합니다.";
      setAccountStatus(null);

      try {
        // is_active 는 유효 수강권 보유 여부라, 계정 선택 단계에서는 전체를 보여준다.
        const page = await CourseApi.students.list(academyId, {
          limit: 100,
          sort: "name",
        });
        const items = page.items || [];
        fillSelect(studentSelect, items, "수강생을 선택하세요", "등록된 수강생이 없습니다");
        studentSelect.disabled = !items.length;
        if (!items.length) {
          studentHint.textContent = "이 아카데미에는 수강생이 없어요. '정보 등록'에서 먼저 추가해 주세요.";
        }
      } catch (err) {
        setSelectPlaceholder(studentSelect, "목록을 불러오지 못했습니다");
        setAccountStatus("error", CourseApi.messageFromError(err));
      }
    }

    // ---------- 이벤트 ----------
    academySelect.addEventListener("change", () => {
      const opt = academySelect.selectedOptions[0];
      selected.academy = academySelect.value
        ? { id: Number(academySelect.value), name: opt.textContent }
        : null;
      selected.student = null;

      if (ROLES[currentRole] && ROLES[currentRole].needsStudent) {
        if (selected.academy) {
          loadStudents(selected.academy.id);
        } else {
          setSelectPlaceholder(studentSelect, "아카데미를 먼저 선택하세요");
          studentSelect.disabled = true;
        }
      }
      refreshEnterEnabled();
    });

    studentSelect.addEventListener("change", () => {
      const opt = studentSelect.selectedOptions[0];
      selected.student = studentSelect.value
        ? { id: Number(studentSelect.value), name: opt.textContent }
        : null;
      refreshEnterEnabled();
    });

    enterBtn.addEventListener("click", enterChat);
    addPassBtn.addEventListener("click", openPassForm);

    roleButtons.forEach((btn) => {
      btn.addEventListener("click", () => goToAccountStep(btn.dataset.role));
    });

    backBtn.addEventListener("click", goBack);

    input.addEventListener("input", syncInput);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      syncInput();
      input.focus();
      // TODO: 백엔드 Agent API 연동 자리 (현재는 목 응답)
    });
  </script>
</body>
</html>
